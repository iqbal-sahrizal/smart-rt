<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563EB" />
    <title>Koneksi Terputus — Smart RT</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --navy: #172554;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1rem
          calc(1.5rem + env(safe-area-inset-bottom, 0px));
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
        text-align: center;
        box-shadow:
          0 4px 12px -2px rgba(15, 23, 42, 0.06),
          0 2px 6px -2px rgba(15, 23, 42, 0.04);
      }
      .logo-badge {
        display: inline-flex;
        width: 3rem;
        height: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        background: var(--navy);
        color: #f8fafc;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        line-height: 1.55;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
      }
      .btn-primary {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        background: var(--primary);
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.7rem 1rem;
        cursor: pointer;
        transition: background-color 150ms ease;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-secondary {
        display: inline-block;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
        color: var(--text);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.6rem 1rem;
        text-decoration: none;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 1rem;
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: #d97706;
      }
      .dot.online {
        background: #0d9488;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="logo-badge" aria-hidden="true">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M4 10.5L12 4L20 10.5V18.5C20 19.3284 19.3284 20 18.5 20H5.5C4.67157 20 4 19.3284 4 18.5V10.5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="M9 20V13.5C9 12.6716 9.67157 12 10.5 12H13.5C14.3284 12 15 12.6716 15 13.5V20"
            stroke="#3B82F6"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <circle cx="12" cy="8.25" r="1.25" fill="#14B8A6" />
        </svg>
      </div>
      <h1>Koneksi Internet Terputus</h1>
      <p>
        Smart RT membutuhkan sambungan internet untuk memuat informasi terbaru
        secara aman. Sesi akun dan data pribadi Anda tetap terlindungi.
      </p>
      <div class="actions">
        <button
          type="button"
          class="btn-primary"
          onclick="window.location.reload()"
        >
          Coba Muat Ulang
        </button>
        <a href="/resident" class="btn-secondary">Kembali ke Beranda Warga</a>
      </div>
      <div class="status-pill" role="status" aria-live="polite">
        <span id="net-dot" class="dot"></span>
        <span id="net-text">Menunggu sambungan jaringan...</span>
      </div>
    </main>
    <script>
      window.addEventListener("online", function () {
        var dot = document.getElementById("net-dot");
        var text = document.getElementById("net-text");
        if (dot) dot.className = "dot online";
        if (text) text.textContent = "Koneksi kembali tersedia. Memuat ulang...";
        setTimeout(function () {
          window.location.reload();
        }, 400);
      });
    </script>
  </body>
</html>
